workflow: TrunkBased/preview1
tag-prefix: '[vV]?'
ignore:
  paths:
  - ^(?!src\/|Directory\.Packages\.props|GitVersion.yml).*
branches:
  release:
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    regex: ^releases?[\/-](?<BranchName>.+)
    source-branches:
    - main
    is-release-branch: true
    is-main-branch: true
    pre-release-weight: 55000
  develop:
    mode: ContinuousDelivery
    label: alpha
    increment: Minor
    regex: ^develop$
    source-branches:
    - main
    prevent-increment:
      when-current-commit-tagged: false
    pre-release-weight: 0
  feature:
    source-branches:
    - main
    - develop
    - release
  hotfix:
    source-branches:
    - main
    - release
  pull-request:
    source-branches:
    - main
    - develop
    - release
    - feature
    - hotfix

prevent-increment:
  of-merged-branch: true
  when-current-commit-tagged: true
